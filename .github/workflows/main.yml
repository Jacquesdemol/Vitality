name: Beta Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Find and Rename APK
        run: |
          APK_PATH=$(find . -name "*.apk" | grep debug | head -n 1)
          mv "$APK_PATH" vitality-beta.apk

      - name: Tag
        id: tagger
        run: echo "tag=beta-v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Vitality Beta ${{ steps.tagger.outputs.tag }}"
          body: |
            🚀 **Versão Beta Automática**
            
            - Commit base: ${{ github.sha }}
            - Workflow Run: #${{ github.run_number }}
          prerelease: true
          draft: false
          files: vitality-beta.apk
